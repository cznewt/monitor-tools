  title: payments (rust, dev)
  description: "Rust samples - tracing JSON logging, prometheus crate on :9100, OpenTelemetry traces over OTLP/gRPC (opentelemetry 0.30); service.name=payments, deployment.environment=dev"
  tags: [demo, rust, logs, metrics, traces]
  links:
    - { url: "https://github.com/cznewt/monitor-tools/tree/main/extra/app-instrumentation", title: Source (app-instrumentation), icon: github }
  annotations:

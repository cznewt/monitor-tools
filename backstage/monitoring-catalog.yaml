spec:
  owner: platform-team
  domain: onlinestore
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: onlinestore-workshop
  description: Demo shop as the course lessons query it (namespace global-monitor-demo) - telemetry in the shared anonymous tenant
spec:
  owner: platform-team
  domain: onlinestore
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: demo-python-dev
  title: checkout (python, dev)
  description: "Python samples - logging module, prometheus_client on :9100, OpenTelemetry traces over OTLP/gRPC; service.name=checkout, deployment.environment=dev"
  tags: [demo, python, logs, metrics, traces]
  links:
    - { url: "https://github.com/cznewt/monitor-tools/tree/main/extra/app-instrumentation", title: Source (app-instrumentation), icon: github }
  annotations:
    backstage.io/kubernetes-namespace: demo-dev
    backstage.io/kubernetes-label-selector: "app.kubernetes.io/part-of=demo-apps"
spec:
  type: service
  lifecycle: experimental
  owner: platform-team
  system: onlinestore-dev
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: demo-go-dev
  title: warehouse (go, dev)
  description: "Go samples - Zap JSON logging, client_golang on :9100, OpenTelemetry traces over OTLP/gRPC; service.name=warehouse, deployment.environment=dev"
  tags: [demo, go, logs, metrics, traces]
  links:
    - { url: "https://github.com/cznewt/monitor-tools/tree/main/extra/app-instrumentation", title: Source (app-instrumentation), icon: github }

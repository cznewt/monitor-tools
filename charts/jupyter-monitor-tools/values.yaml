image:
  repository: ghcr.io/cznewt/jupyter-monitor-tools
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8888

# Disabled by default - JupyterLab has no built-in auth, so exposing it via
# Ingress means putting your own auth in front (annotations for e.g.
# oauth2-proxy, basic-auth, or a cluster SSO gateway) rather than relying on
# network-only access via kubectl port-forward.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jupyter-monitor-tools.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: jupyter-monitor-tools-tls
    #   hosts:
    #     - jupyter-monitor-tools.example.com

# Map of config filename -> raw YAML content. Mounted into /config.
configs: {}

# Glob (relative to the chart root) of config files to bake into the ConfigMap.
# Defaults to "configs/*.yaml" — drop your env YAMLs into charts/jupyter-monitor-tools/configs/.
configsDir: "configs/*.yaml"

# Env vars exposed to the Jupyter container (apply-* scripts read GRAFANA_URL,
# GRAFANA_TOKEN, MIMIR_ADDRESS, MIMIR_TENANT_ID, LOKI_ADDRESS, LOKI_TENANT_ID, ...).
env: {}
  # GRAFANA_URL: https://grafana.example.com
  # GRAFANA_TOKEN: <token>

# Reference a pre-existing Secret instead of creating one from .env above.
existingSecret: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Defaults satisfy the Kubernetes "restricted" Pod Security Standard. The
# image (extra/jupyter-monitor-tools/docker/Dockerfile) already runs as a
# non-root `ubuntu` user, so runAsNonRoot is safe with no image changes.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

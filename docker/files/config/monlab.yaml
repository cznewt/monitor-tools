# monitoring-lab (grafana.monlab.newt.cz): the upstream Kubernetes monitoring
# set from k8s-monitoring.yaml (kubernetes-mixin multi-cluster, node-exporter,
# kube-state-metrics, LGTM + alertmanager mixins, cert-manager, ingress-nginx,
# kubernetes-events, OpenCost, base) plus the Argo CD mixin and the observ-viz
# `platform` and `monlab` scenarios (schema v2). Dashboards go through the
# app-platform API (grafana.render: grafanactl) because grizzly cannot push v2
# boards; rules through mimirtool. The lab ruler (tenant anonymous) already holds
# the kubernetes-mixin and node-mixin groups under those namespace names, so the
# config reuses them (recording rules and alerts in separate namespaces, via
# mimirAlertNamespace): a push replaces those groups instead of duplicating them. Datasource uid global-monitor-mimir-server
# is monlab's mimir-monolith.
name: monlab
prometheus:
  render: mimirtool
# Loki's ruler API is read-only on its local rule store, so rule groups go in
# as a ConfigMap that the Loki config sidecar syncs into the ruler's directory.
loki:
  render: configmap
  namespace: global-monitor-loki
  labels:
    loki/rules: loki-monolith
grafana:
  render: grafanactl
# Service level objectives for the lab's own platform, as Pyrra manifests.
# `pyrra generate` turns them into burn-rate recordings and multi-window alerts
# which land in the Mimir ruler under the 'pyrra' namespace, so an SLO is a rule
# group like any other. Every indicator is a metric Alloy already writes to
# Mimir - the lab Prometheus does not remote-write, so its own series cannot
# carry an SLO here.
pyrra:
  render: mimirtool
  namespace: pyrra
  slos:
    apiserver-read-latency:
      apiVersion: pyrra.dev/v1alpha1
      kind: ServiceLevelObjective
      metadata:
        name: apiserver-read-latency
        namespace: kube-monitor
        labels:
          role: alert-rules
      spec:
        description: Latency of read requests to the Kubernetes API server.
        target: "99"
        window: 2w
        indicator:
          latency:
            success:
              metric: apiserver_request_sli_duration_seconds_bucket{verb=~"LIST|GET",le="0.1"}
            total:
              metric: apiserver_request_sli_duration_seconds_bucket{verb=~"LIST|GET"}
    kubelet-runtime-errors:
      apiVersion: pyrra.dev/v1alpha1
      kind: ServiceLevelObjective
      metadata:
        name: kubelet-runtime-errors
        namespace: kube-monitor
        labels:
          role: alert-rules
      spec:
        description: Container runtime operations the kubelet fails.
        target: "99"
        window: 2w
        indicator:
          ratio:
            errors:
              metric: kubelet_runtime_operations_errors_total{job="integrations/kubernetes/kubelet"}
            total:
              metric: kubelet_runtime_operations_total{job="integrations/kubernetes/kubelet"}
    coredns-response-errors:
      apiVersion: pyrra.dev/v1alpha1
      kind: ServiceLevelObjective
      metadata:
        name: coredns-response-errors
        namespace: kube-monitor
        labels:
          role: alert-rules
      spec:
        description: DNS answers the cluster resolver fails to serve.
        target: "99.9"
        window: 2w
        indicator:
          ratio:
            errors:
              metric: coredns_dns_responses_total{job="integrations/kubernetes/kube-dns",rcode="SERVFAIL"}
            total:
              metric: coredns_dns_responses_total{job="integrations/kubernetes/kube-dns"}
    ingress-nginx-latency:
      apiVersion: pyrra.dev/v1alpha1
      kind: ServiceLevelObjective
      metadata:
        name: ingress-nginx-latency
        namespace: infra-ingress-nginx
        labels:
          role: alert-rules
      spec:
        description: Latency of requests through the ingress controller.
        target: "95"
        window: 2w
        indicator:
          latency:
            success:
              metric: nginx_ingress_controller_request_duration_seconds_bucket{le="0.25"}
            total:
              metric: nginx_ingress_controller_request_duration_seconds_bucket{le="+Inf"}
    mimir-request-errors:
      apiVersion: pyrra.dev/v1alpha1
      kind: ServiceLevelObjective
      metadata:
        name: mimir-request-errors
        namespace: global-monitor-mimir
        labels:
          role: alert-rules
      spec:
        description: Requests Mimir answers with a server error.
        target: "99.5"
        window: 2w
        indicator:
          ratio:
            errors:
              metric: cortex_request_duration_seconds_count{status_code=~"5.."}
            total:
              metric: cortex_request_duration_seconds_count
mixins:
  # No base mixin here: its flat boards are superseded by the tabbed observ-viz
  # platform pair (Kubernetes / Clusters and Kubernetes / Cluster in the Lab
  # platform folder), which carry the same overview with per-signal tabs, alerts
  # and a runbook panel per alert.
  kubernetes:
    mixinDir: /source/mixins/kubernetes-mixin
    vendorDir: /source/mixins/kubernetes-mixin/vendor
    config:
      showMultiCluster: true
      mimirNamespace: kubernetes-mixin
      mimirAlertNamespace: kubernetes-mixin-alerts
      grafanaDashboardFolder: kubernetes-mixin
      grafanaDashboardFolderParent: Upstream
      cadvisorSelector: job="integrations/kubernetes/cadvisor"
      kubeletSelector: job="integrations/kubernetes/kubelet"
      kubeApiserverSelector: job="integrations/kubernetes/kube-apiserver"
      kubeProxySelector: job="integrations/kubernetes/kube-proxy"
      kubeStateMetricsSelector: job="integrations/kubernetes/kube-state-metrics"
      nodeExporterSelector: job="integrations/node_exporter"
    source:
      git:
        url: https://github.com/kubernetes-monitoring/kubernetes-mixin.git
        ref: master
        depth: 1
  kube-state-metrics:
    config:
      # rules only - the mixin ships no dashboards, so no folder here
      mimirNamespace: kube-state-metrics
    source:
      git:
        url: https://github.com/kubernetes/kube-state-metrics.git
        ref: main
        depth: 1
      includePaths:
      - jsonnet/kube-state-metrics-mixin//**/*
      newRootPath: jsonnet/kube-state-metrics-mixin
  node-exporter:
    config:
      mimirNamespace: node-mixin
      mimirAlertNamespace: node-mixin-alerts
      grafanaDashboardFolder: node-mixin
      grafanaDashboardFolderParent: Upstream
      nodeExporterSelector: job="integrations/node_exporter"
    source:
      git:
        url: https://github.com/prometheus/node_exporter.git
        ref: master
        depth: 1
      includePaths:
      - docs/node-mixin/**/*
      newRootPath: docs/node-mixin
  alloy:
    config:
      mimirNamespace: alloy
      grafanaDashboardFolder: alloy-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      git:
        url: https://github.com/grafana/alloy.git
        ref: main
        depth: 1
      includePaths:
      - operations/alloy-mixin/**/*
      newRootPath: operations/alloy-mixin
  mimir:
    config:
      mimirNamespace: mimir
      grafanaDashboardFolder: mimir-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      git:
        url: https://github.com/grafana/mimir.git
        ref: main
        depth: 1
      includePaths:
      - operations/mimir-mixin/**/*
      newRootPath: operations/mimir-mixin
  loki:
    config:
      mimirNamespace: loki
      grafanaDashboardFolder: loki-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      git:
        url: https://github.com/grafana/loki.git
        ref: main
        depth: 1
      includePaths:
      - production/loki-mixin/**/*
      newRootPath: production/loki-mixin
  tempo:
    config:
      mimirNamespace: tempo
      grafanaDashboardFolder: tempo-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      git:
        url: https://github.com/grafana/tempo.git
        ref: main
        depth: 1
      includePaths:
      - operations/tempo-mixin/**/*
      newRootPath: operations/tempo-mixin
  alertmanager:
    config:
      mimirNamespace: alertmanager
      grafanaDashboardFolder: alertmanager-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      git:
        url: https://github.com/prometheus/alertmanager.git
        ref: main
        depth: 1
      includePaths:
      - doc/alertmanager-mixin/**/*
      newRootPath: doc/alertmanager-mixin
  cert-manager:
    config:
      mimirNamespace: cert-manager
      enableMultiCluster: true
      grafanaDashboardFolder: cert-manager-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      git:
        url: https://github.com/imusmanmalik/cert-manager-mixin.git
        ref: main
        depth: 1
  ingress-nginx:
    config:
      mimirNamespace: ingress-nginx
      grafanaDashboardFolder: ingress-nginx-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      git:
        url: https://github.com/adinhodovic/ingress-nginx-mixin.git
        ref: main
        depth: 1
  kubernetes-events-alloy:
    config:
      mimirNamespace: kubernetes-events
      grafanaDashboardFolder: kubernetes-events-mixin
      grafanaDashboardFolderParent: Upstream
      # LogQL rules: they are loaded into Loki's ruler, not Mimir's
      lokiRuleGroups:
        - kubernetes-events-alloy.rules
        - kubernetes-events-alloy
    source:
      directory:
        path: /mixins/kubernetes-events-alloy-mixin
  opencost:
    config:
      mimirNamespace: opencost
      grafanaDashboardFolder: opencost-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      directory:
        path: /mixins/opencost-mixin
  argo-cd:
    mixinDir: /source/mixins/argo-cd-mixin
    vendorDir: /source/mixins/argo-cd-mixin/vendor
    config:
      mimirNamespace: argo-cd
      grafanaDashboardFolder: argo-cd-mixin
      grafanaDashboardFolderParent: Upstream
    source:
      git:
        url: https://github.com/adinhodovic/argo-cd-mixin.git
        ref: main
        depth: 1
  observ-viz-platform:
    config:
      scenario: platform
      mimirNamespace: observ-viz-platform
      # title slug == folder uid on purpose: monitor-tools < 2026.9-r15 derives
      # the uid from the title, and a plain "Platform" would collide with the
      # workshop's own folder
      grafanaDashboardFolder: Lab platform
      grafanaDashboardFolderParent: Scenarios
    jpaths:
    - vendor/github.com/cznewt/observ-viz
    source:
      directory:
        path: /mixins/observ-viz-mixin
  observ-viz-services:
    config:
      scenario: monlab
      mimirNamespace: observ-viz-services
      grafanaDashboardFolder: Lab services
      grafanaDashboardFolderParent: Scenarios
    jpaths:
    - vendor/github.com/cznewt/observ-viz
    source:
      directory:
        path: /mixins/observ-viz-mixin
  # the observ-viz reference library (Panels / Runtimes / Deployments). Its
  # boards carry their own nested folder, so no grafanaDashboardFolder here -
  # that needs monitor-tools >= 2026.9-r15.
  observ-viz-reference:
    config:
      scenario: reference
    jpaths:
    - vendor/github.com/cznewt/observ-viz
    source:
      directory:
        path: /mixins/observ-viz-mixin
dashboards:
  kubernetes-views-global:
    source:
      grafana:
        id: 15757
        revision: 43
    config:
      grafanaDashboardFolder: kubernetes-views
      grafanaDashboardFolderParent: Upstream
      uid: kubernetes-views-global
      datasources:
        DS_PROMETHEUS: global-monitor-mimir-server
  k8s-node-metrics-multi-clusters:
    source:
      grafana:
        id: 22413
        revision: 6
    config:
      grafanaDashboardFolder: kubernetes-views
      grafanaDashboardFolderParent: Upstream
      uid: k8s-node-metrics-multi-clusters
  pyroscope-overview:
    source:
      http:
        url: https://raw.githubusercontent.com/cznewt/monitor-tools/main/pyroscope-mixin/pyroscope-overview.json
        sha256: 72c6d410677101f3317f74473930b17dd76e77a8c578c4d81e7e189f820c5a0b
    config:
      grafanaDashboardFolder: pyroscope-mixin

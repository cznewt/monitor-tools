name: monlab-escalation
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by: [alertname, cluster, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # critical -> page (fast repeat) and also continue to ticketing
        - matchers: ['severity="critical"']
          receiver: page
          group_wait: 10s
          repeat_interval: 1h
          continue: true
        # warning -> ticket
        - matchers: ['severity="warning"']
          receiver: ticket
        # info -> swallow
        - matchers: ['severity="info"']
          receiver: 'null'
        # Machine-actionable alerts -> the action handler, in parallel with the
        # human receivers above. Uncomment once gedu-prg-infra-alert-handler is
        # actually deployed and reachable from this Alertmanager - until then it
        # would only produce notification failures.
        # - matchers: ['severity=~"warning|critical"']
        #   receiver: alert-handler
        #   continue: true
    receivers:
      - name: 'null'
      - name: page
        pagerduty_configs:
          - routing_key: CHANGEME-pagerduty-routing-key
            send_resolved: true
      - name: ticket
        slack_configs:
          - api_url: https://hooks.slack.com/services/CHANGEME
            channel: '#alerts'
            send_resolved: true
      # The handler answers 202 as soon as it has queued the actions, so it
      # never holds this Alertmanager up. With settings.auth_token set, add
      # http_config.authorization: {type: Bearer, credentials: <token>}.
      # - name: alert-handler
      #   webhook_configs:
      #     - url: http://<alert-handler host>:8080/alert
      #       send_resolved: true
  templates: {}
